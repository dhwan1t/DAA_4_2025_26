<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Huffman Compressor</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="glass-card">
                <h1>Huffman Compressor</h1>
                <div class="input-group">
                    <textarea
                        id="inputText"
                        rows="4"
                        placeholder="Enter text to compress here..."
                    ></textarea>
                </div>
                <button id="compressBtn">Compress</button>
                <div id="errorMessage" class="error hidden">
                    Server error, try again
                </div>

                <div id="results" class="results-container hidden">
                    <div class="result-section">
                        <h3>Original Binary (8-bit ASCII)</h3>
                        <div id="originalBinary" class="output-box"></div>
                    </div>
                    <div class="result-section">
                        <h3>Compressed Binary</h3>
                        <div id="compressedBinary" class="output-box"></div>
                    </div>
                    <div class="result-section">
                        <h3>Compression Ratio</h3>
                        <div
                            id="compressionRatio"
                            class="output-box highlight"
                        ></div>
                    </div>
                    <div class="result-section" id="codeTableSection">
                        <h3>Code Table</h3>
                        <div id="codeTable" class="code-grid"></div>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
